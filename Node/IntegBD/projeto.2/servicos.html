<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Serviços - Me Organiza</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="container">
    <h2>Serviços</h2>

    <form id="formServico">
      <input type="hidden" id="id">
      <input type="text" id="nome" placeholder="Nome do serviço" required>
      <input type="number" id="duracao" placeholder="Duração prevista (min)" min="1" required>
      <input type="number" step="0.01" id="preco" placeholder="Preço (ex: 120.00)" min="0">
      <textarea id="descricao" placeholder="Descrição (opcional)"></textarea>
      <button type="submit">Salvar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Duração (min)</th>
          <th>Preço</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaServicos"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/servicos.js"></script>
</body>
</html>
