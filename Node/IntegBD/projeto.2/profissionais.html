<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Profissionais - Me Organiza</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="container">
    <h2>Profissionais</h2>

    <form id="formProfissional">
      <input type="hidden" id="id">
      <input type="text" id="nome" placeholder="Nome do profissional" required>
      <input type="text" id="especialidade" placeholder="Especialidade" required>
      <input type="text" id="telefone" placeholder="Telefone">
      <button type="submit">Salvar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Especialidade</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaProfissionais"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profissionais.js"></script>
</body>
</html>
